<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <!-- Configuração de codificação de caracteres e responsividade para dispositivos móveis -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metroform - Todas as Vagas Abertas</title>
    
    <!-- Importa a biblioteca FontAwesome para exibir ícones gráficos profissionais -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Importa as folhas de estilo customizadas do sistema e da página de vagas -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="vagas.css">
</head>
<body>

    <!-- ========================================== -->
    <!-- CABEÇALHO PADRONIZADO DA METROFORM         -->
    <!-- ========================================== -->
    <header class="header-metroform">
    <!-- Logótipo da empresa com link de retorno à página principal -->
    <div class="logo">
        <a href="index.html">
            <img src="img/logo.jpg" alt="Logo Metroform">
        </a>
    </div>
    <!-- Botão de navegação rápida padronizado com as classes corretas -->
    <div class="acesso-buttons">
        <a href="index.html" class="btn-profissional">
            <i class="fa-solid fa-arrow-left"></i> Voltar ao Início
        </a>
    </div>
</header>

    <!-- ========================================== -->
    <!-- CONTEÚDO PRINCIPAL: LISTAGEM DE VAGAS      -->
    <!-- ========================================== -->
    <main class="container-vagas-pagina">
        
        <!-- Cabeçalho descritivo da seção de oportunidades -->
        <div class="vagas-cabecalho-secao">
            <h2>Oportunidades em Aberto na Metroform</h2>
            <p>Explore todas as vagas disponíveis e encontre a que melhor se adapta ao seu perfil profissional.</p>
        </div>

        <!-- Barra de Filtros Rápidos (Pesquisa por texto e seleção de setores) -->
        <div class="barra-filtros">
            <input type="text" id="filtro-busca" placeholder="Pesquisar por cargo ou palavra-chave...">
            <select id="filtro-setor">
                <option value="">Todos os Setores</option>
                <option value="Industrial">Industrial</option>
                <option value="Engenharia">Engenharia</option>
                <option value="Tecnologia">Tecnologia</option>
            </select>
        </div>

        <!-- Grade onde as vagas dinâmicas serão exibidas -->
        <div class="grid-vagas-completa">
            <p style="grid-column: 1 / -1; text-align: center; color: #666; font-size: 16px; padding: 20px;">
                A carregar oportunidades...
            </p>
        </div>
        
    </main>

    <!-- Importação do script JavaScript externo responsável pela lógica da página de vagas -->
    <script src="vagas.js"></script>
</body>
</html>
