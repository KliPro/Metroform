<!DOCTYPE html>
<!-- Informa ao navegador que este documento utiliza a versão padrão e moderna do HTML5 -->
<html lang="pt-BR">
<head>
    <!-- Configurações fundamentais da página -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metroform - Portal do Candidato | Entrar ou Cadastrar</title>
    
    <!-- Importa a biblioteca FontAwesome para exibir ícones gráficos profissionais -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Importa a folha de estilos personalizada da tela de login -->
    <link rel="stylesheet" href="login.css">
</head>
<body class="pagina-login">
    <!-- Abre o corpo do documento. A classe 'pagina-login' define o fundo exclusivo -->

    <!-- ========================================== -->
    <!-- CABEÇALHO IDÊNTICO AO DA PÁGINA PRINCIPAL  -->
    <!-- ========================================== -->
    <header class="header-metroform">
        <!-- Utiliza a mesma classe do cabeçalho principal para herdar a listra vermelha e o estilo -->
        
        <div class="logo">
            <!-- Bloco do Logotipo da Empresa -->
            <a href="index.html">
                <img src="img/logo.jpg" alt="Logo Metroform">
            </a>
        </div>

        <!-- Botão de retorno à página inicial alinhado à direita -->
        <div class="acesso-buttons">
            <a href="index.html" class="btn-profissional"><i class="fa-solid fa-arrow-left"></i> Voltar ao Início</a>
        </div>
    </header>

    <!-- ========================================== -->
    <!-- CONTAINER PRINCIPAL DO FORMULÁRIO (MODAL)  -->
    <!-- ========================================== -->
    <main class="container-autenticacao">
        
        <!-- Caixa centralizada do formulário -->
        <div class="card-autenticacao">
            
            <!-- Cabeçalho do Card com título dinâmico -->
            <div class="auth-cabecalho">
                <h2>Área do Candidato</h2>
                <p>Acesse sua conta ou cadastre-se para gerenciar suas candidaturas.</p>
            </div>

            <!-- Botões de Alternância (Abas): Entrar vs Cadastrar -->
            <div class="auth-abas">
                <button class="aba-btn ativo" onclick="mudarAba('login')">Entrar</button>
                <button class="aba-btn" onclick="mudarAba('cadastro')">Criar Conta</button>
            </div>

            <!-- ========================================== -->
            <!-- FORMULÁRIO DE LOGIN (ENTRAR)              -->
            <!-- ========================================== -->
            <form id="form-login" class="formulario-auth ativo-form">
                
                <!-- Campo de E-mail -->
                <div class="grupo-input">
                    <label for="email-login">E-mail Profissional ou Pessoal</label>
                    <div class="input-com-icone">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email-login" placeholder="seu.email@exemplo.com" required>
                    </div>
                </div>

                <!-- Campo de Senha -->
                <div class="grupo-input">
                    <label for="senha-login">Senha</label>
                    <div class="input-com-icone">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="senha-login" placeholder="Digite sua senha" required>
                    </div>
                </div>

                <!-- Link de recuperação de senha -->
                <div class="acoes-extras">
                    <a href="#" class="esqueci-senha">Esqueceu sua senha?</a>
                </div>

                <!-- Botão de Submissão do Login -->
                <button type="submit" class="btn-submit-auth">Entrar na Plataforma</button>
            </form>

            <!-- ========================================== -->
            <!-- FORMULÁRIO DE CADASTRO (CRIAR CONTA)      -->
            <!-- ========================================== -->
            <form id="form-cadastro" class="formulario-auth oculto">
                
                <!-- Campo de Nome Completo -->
                <div class="grupo-input">
                    <label for="nome-cadastro">Nome Completo</label>
                    <div class="input-com-icone">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="nome-cadastro" placeholder="Seu nome completo" required>
                    </div>
                </div>

                <!-- Campo de E-mail para cadastro -->
                <div class="grupo-input">
                    <label for="email-cadastro">E-mail</label>
                    <div class="input-com-icone">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email-cadastro" placeholder="seu.email@exemplo.com" required>
                    </div>
                </div>

                <!-- Campo de Senha para cadastro -->
                <div class="grupo-input">
                    <label for="senha-cadastro">Criar Senha</label>
                    <div class="input-com-icone">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="senha-cadastro" placeholder="Mínimo de 6 caracteres" required>
                    </div>
                </div>

                <!-- Botão de Submissão do Cadastro -->
                <button type="submit" class="btn-submit-auth">Cadastrar e Continuar</button>
            </form>

        </div>
    </main>

    <!-- ========================================== -->
    <!-- SCRIPT SIMPLES PARA ALTERNAR AS ABAS      -->
    <!-- ========================================== -->
    <script>
    /* Função JavaScript para alternar visualmente entre a tela de Login e a tela de Cadastro */
    function mudarAba(tipo) {
        const btnLogin = document.querySelector('.auth-abas button:nth-child(1)');
        const btnCadastro = document.querySelector('.auth-abas button:nth-child(2)');
        const formLogin = document.getElementById('form-login');
        const formCadastro = document.getElementById('form-cadastro');

        if (tipo === 'login') {
            if (btnLogin) btnLogin.classList.add('ativo');
            if (btnCadastro) btnCadastro.classList.remove('ativo');
            if (formLogin) {
                formLogin.classList.remove('oculto');
                formLogin.classList.add('ativo-form');
            }
            if (formCadastro) {
                formCadastro.classList.remove('ativo-form');
                formCadastro.classList.add('oculto');
            }
        } else {
            if (btnCadastro) btnCadastro.classList.add('ativo');
            if (btnLogin) btnLogin.classList.remove('ativo');
            if (formCadastro) {
                formCadastro.classList.remove('oculto');
                formCadastro.classList.add('ativo-form');
            }
            if (formLogin) {
                formLogin.classList.remove('ativo-form');
                formLogin.classList.add('oculto');
            }
        }
    }

    // 1. CÓDIGO DE CADASTRO
    document.getElementById('form-cadastro').addEventListener('submit', async function(e) {
        e.preventDefault();

        const dadosCandidato = {
            nome: document.getElementById('nome-cadastro').value,
            email: document.getElementById('email-cadastro').value,
            senha: document.getElementById('senha-cadastro').value
        };

        try {
            const resposta = await fetch('http://localhost:3000/api/candidatos', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dadosCandidato)
            });

            const resultado = await resposta.json();

            if (resposta.ok) {
                alert(resultado.mensagem);
                document.getElementById('form-cadastro').reset();
            } else {
                alert(resultado.erro);
            }
        } catch (erro) {
            console.error('Erro de conexão:', erro);
            alert('Não foi possível conectar ao servidor backend.');
        }
    });

    // 2. CÓDIGO DE LOGIN
    document.getElementById('form-login').addEventListener('submit', async function(e) {
    e.preventDefault();

    const dadosLogin = {
        email: document.getElementById('email-login').value,
        senha: document.getElementById('senha-login').value
    };

    try {
        const resposta = await fetch('http://localhost:3000/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(dadosLogin)
        });

        const resultado = await resposta.json();

        if (resposta.ok) {
            // Guarda os dados do candidato no navegador para usar na página de perfil
            localStorage.setItem('candidatoLogado', JSON.stringify(resultado.candidato));
            
            // Redireciona diretamente para a página de perfil
            window.location.href = 'perfil.html';
        } else {
            alert(resultado.erro);
        }
    } catch (erro) {
        console.error('Erro de conexão:', erro);
        alert('Não foi possível conectar ao servidor backend.');
    }
    });
</script>

</body>
</html>
<!-- Fim do documento HTML da tela de autenticação -->
