<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metroform - Meu Perfil</title>
    <!-- Importação da biblioteca FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="perfil.css">
</head>

<body class="pagina-perfil-corpo">
    <header class="header-metroform">
        <div class="logo">
            <a href="index.html">
                <img src="img/logo.jpg" alt="Logo Metroform">
            </a>
        </div>
        
        <button type="button" onclick="logout()" class="btn-sair-perfil">
            <i class="fa-solid fa-right-from-bracket"></i> Sair da Conta
        </button>
    </header>

    <main class="container-perfil">
        <!-- Cartão de Informações e Edição de Perfil -->
        <section class="card-info-usuario">
            <div class="perfil-cabecalho">
                <div class="avatar-container" id="avatar-container-wrapper">
                    <!-- A foto ou as iniciais entram aqui dinamicamente -->
                    <img id="foto-preview" src="img/default-avatar.png" alt="Foto de Perfil" class="foto-perfil">
                </div>
                <div class="dados-usuario">
                    <h2 id="nome-exibir">Nome do Utilizador</h2>
    
                    <!-- Formação / O que é formado -->
                    <p id="formacao-exibir" style="color: #7A0000; font-weight: 600; font-size: 15px; margin-bottom: 8px;">
                        <i class="fa-solid fa-graduation-cap"></i> Formação não informada
                    </p>

                    <!-- E-mail -->
                    <p><i class="fa-solid fa-envelope"></i> <span id="email-exibir">-</span></p>
    
                    <!-- Telefone -->
                    <p><i class="fa-solid fa-phone"></i> <span id="telefone-exibir">Não informado</span></p>
    
                    <!-- Onde Mora / Endereço -->
                    <p id="cidade-exibir">
                        <i class="fa-solid fa-location-dot"></i> Endereço não informado
                    </p>
                </div>
            </div>
            
            <div class="resumo-profissional">
                <h4><i class="fa-solid fa-id-card"></i> Resumo Profissional</h4>
                <p id="resumo-exibir">Adicione um resumo sobre a sua experiência profissional...</p>
            </div>

            <div class="acoes-perfil">
                <button onclick="abrirModalEdicao()" class="btn-editar-perfil-corporativo">
                    <i class="fa-solid fa-pen-to-square"></i> Editar Perfil
                </button>
            </div>
        </section>

        <!-- Cartão de Currículo -->
        <section class="card-curriculo">
            <h3><i class="fa-solid fa-file-pdf" style="color: #7A0000;"></i> Meu Currículo</h3>
            <div id="status-curriculo">
                <p style="color: #666;">Nenhum currículo em PDF enviado.</p>
            </div>
        </section>

        <!-- Cartão de Minhas Candidaturas -->
        <section class="card-candidaturas">
            <h3><i class="fa-solid fa-briefcase" style="color: #7A0000;"></i> Minhas Candidaturas</h3>
            <div id="grid-candidaturas">
                <p class="carregando-candidaturas">A carregar candidaturas...</p>
            </div>
        </section>
    </main>

    <!-- MODAL DE EDIÇÃO DE PERFIL -->
    <div id="modal-edicao" class="modal-overlay oculto">
        <div class="modal-conteudo">
            <div class="modal-cabecalho-topo">
                <h3><i class="fa-solid fa-user-pen"></i> Editar Meu Perfil</h3>
                <button type="button" onclick="fecharModalEdicao()" class="btn-fechar-modal"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="form-editar-perfil" enctype="multipart/form-data">
                <div class="grupo-input">
                    <label for="edit-nome">Nome Completo</label>
                    <input type="text" id="edit-nome" required>
                </div>
                
                <div class="grupo-input">
                    <label for="edit-telefone">Telefone</label>
                    <input type="text" id="edit-telefone" placeholder="(11) 99999-9999">
                </div>

                <!-- Campos de Formação e Cidade movidos para dentro do Modal -->
                <div class="grupo-input">
                    <label for="edit-formacao">Formação / O que é formado</label>
                    <input type="text" id="edit-formacao" placeholder="Ex: Bacharel em Ciência da Computação">
                </div>

                <div class="grupo-input">
                    <label for="edit-cidade">Onde Mora (Cidade / Estado)</label>
                    <input type="text" id="edit-cidade" placeholder="Ex: Guarulhos - SP">
                </div>

                <div class="grupo-input">
                    <label for="edit-resumo">Resumo Profissional</label>
                    <textarea id="edit-resumo" rows="4" placeholder="Conte um pouco sobre a sua experiência..."></textarea>
                </div>

                <div class="grupo-input">
                    <label for="edit-foto">Foto de Perfil (Imagem)</label>
                    <input type="file" id="edit-foto" accept="image/*">
                </div>

                <div class="grupo-input">
                    <label for="edit-curriculo">Currículo em PDF</label>
                    <input type="file" id="edit-curriculo" accept=".pdf">
                </div>

                <div class="modal-botoes">
                    <button type="button" onclick="fecharModalEdicao()" class="btn-cancelar">Cancelar</button>
                    <button type="submit" class="btn-salvar-corporativo">Salvar Alterações</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Conecta o JavaScript externo -->
    <script src="perfil.js"></script>
</body>
</html>
