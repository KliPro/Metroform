<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metroform - Acesso e Cadastro do RH</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="rh_login.css">
</head>
<body class="pagina-login-rh">

    <!-- CABEÇALHO PADRÃO DO SITE -->
    <header class="header-metroform">
        <div class="logo">
            <a href="index.html">
                <img src="img/logo.jpg" alt="Logo Metroform">
            </a>
        </div>
        <div>
            <a href="index.html" class="btn-profissional"><i class="fa-solid fa-arrow-left"></i> Voltar ao Início</a>
        </div>
    </header>

    <!-- CONTEÚDO CENTRALIZADO -->
    <main class="login-conteudo-principal">
        <div class="card-login-rh">
            
            <div class="login-cabecalho">
                <i class="fa-solid fa-user-shield"></i>
                <h2>Portal do Gestor - RH</h2>
                <p>Gestão de vagas e candidatos da Metroform.</p>
            </div>

            <!-- ABAS DE NAVEGAÇÃO (Entrar / Criar Conta) -->
            <div style="display: flex; background: #f1f3f5; padding: 4px; border-radius: 6px; margin-bottom: 25px;">
                <button type="button" id="aba-entrar" onclick="alternarAba('entrar')" style="flex: 1; padding: 10px; border: none; background: white; color: #8B0000; font-weight: bold; border-radius: 4px; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.05); transition: all 0.3s;">Entrar</button>
                <button type="button" id="aba-cadastrar" onclick="alternarAba('cadastrar')" style="flex: 1; padding: 10px; border: none; background: transparent; color: #555; font-weight: bold; border-radius: 4px; cursor: pointer; transition: all 0.3s;">Criar Conta</button>
            </div>

            <!-- FORMULÁRIO DE LOGIN -->
            <form id="form-login-rh">
                <div class="grupo-input-login">
                    <label for="email-rh">E-mail Corporativo</label>
                    <input type="email" id="email-rh" required placeholder="ex: rh@metroform.com">
                </div>

                <div class="grupo-input-login">
                    <label for="senha-rh">Palavra-passe</label>
                    <input type="password" id="senha-rh" required placeholder="Digite sua senha">
                </div>

                <button type="submit" class="btn-entrar-rh">
                    Entrar no Painel
                </button>
            </form>

            <!-- FORMULÁRIO DE CADASTRO (Oculto por padrão) -->
            <form id="form-cadastro-rh" style="display: none;">
                <div class="grupo-input-login">
                    <label for="nome-cadastro-rh">Nome Completo</label>
                    <input type="text" id="nome-cadastro-rh" required placeholder="Seu nome">
                </div>

                <div class="grupo-input-login">
                    <label for="email-cadastro-rh">E-mail Corporativo</label>
                    <input type="email" id="email-cadastro-rh" required placeholder="rh@metroform.com">
                </div>

                <div class="grupo-input-login">
                    <label for="senha-cadastro-rh">Palavra-passe</label>
                    <input type="password" id="senha-cadastro-rh" required placeholder="Crie uma senha forte">
                </div>

                <button type="submit" class="btn-entrar-rh">
                    Registar Novo Gestor
                </button>
            </form>

            <div class="login-rodape" style="margin-top: 20px;">
                <a href="index.html">Precisa de ajuda? Contacte o suporte técnico</a>
            </div>
        </div>
    </main>
    
    <!-- SCRIPTS DE CONTROLO DE ABAS E API -->
    <script>
        function alternarAba(tipo) {
            const btnEntrar = document.getElementById('aba-entrar');
            const btnCadastrar = document.getElementById('aba-cadastrar');
            const formLogin = document.getElementById('form-login-rh');
            const formCadastro = document.getElementById('form-cadastro-rh');

            if (tipo === 'entrar') {
                btnEntrar.style.background = 'white';
                btnEntrar.style.color = '#8B0000';
                btnEntrar.style.boxShadow = '0 2px 5px rgba(0,0,0,0.05)';
                
                btnCadastrar.style.background = 'transparent';
                btnCadastrar.style.color = '#555';
                btnCadastrar.style.boxShadow = 'none';

                formLogin.style.display = 'block';
                formCadastro.style.display = 'none';
            } else {
                btnCadastrar.style.background = 'white';
                btnCadastrar.style.color = '#8B0000';
                btnCadastrar.style.boxShadow = '0 2px 5px rgba(0,0,0,0.05)';
                
                btnEntrar.style.background = 'transparent';
                btnEntrar.style.color = '#555';
                btnEntrar.style.boxShadow = 'none';

                formCadastro.style.display = 'block';
                formLogin.style.display = 'none';
            }
        }

        document.getElementById('form-login-rh').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email-rh').value.trim();
            const senha = document.getElementById('senha-rh').value.trim();

            try {
                const resposta = await fetch('http://localhost:3000/api/login-rh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const dados = await resposta.json();

                if (resposta.ok) {
                    localStorage.setItem('rhLogado', 'true');
                    localStorage.setItem('adminLogado', JSON.stringify(dados.admin));
                    window.location.href = "rh.html";
                } else {
                    alert(dados.erro || 'Credenciais inválidas.');
                }
            } catch (erro) {
                console.error('Erro de conexão:', erro);
                alert('Não foi possível conectar ao servidor backend.');
            }
        });

        document.getElementById('form-cadastro-rh').addEventListener('submit', async function(e) {
            e.preventDefault();

            const nome = document.getElementById('nome-cadastro-rh').value.trim();
            const email = document.getElementById('email-cadastro-rh').value.trim();
            const senha = document.getElementById('senha-cadastro-rh').value.trim();

            try {
                const resposta = await fetch('http://localhost:3000/api/admin-rh', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome, email, senha })
                });

                const dados = await resposta.json();

                if (resposta.ok) {
                    alert('Gestor cadastrado com sucesso! Faça login com suas credenciais.');
                    document.getElementById('form-cadastro-rh').reset();
                    alternarAba('entrar');
                } else {
                    alert(dados.erro || 'Erro ao registrar gestor.');
                }
            } catch (erro) {
                console.error('Erro de conexão:', erro);
                alert('Não foi possível conectar ao servidor backend.');
            }
        });
    </script>
</body>
</html>
